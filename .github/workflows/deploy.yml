name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Frontend Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Build
        working-directory: frontend
        run: npm run build

      - name: Backend Install
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt -c backend/constraints.txt

      - name: Backend Unit Tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/book-rag
            git pull
            sudo docker compose -f docker-compose.prod.yml up -d --build

      - name: Health check
        run: |
          sleep 30
          curl -f https://bookembed.net/backend/health || exit 1
          curl -f https://bookembed.net || exit 1
          echo "✅ Deployment successful"
